kind = "mobile"
previewPath = "/"
title = "Bytewise DSA Coach"
description = "A playful daily data structures and algorithms practice app that turns short coding sessions into a rewarding habit with streaks, XP, progress paths, and focused explanations."
version = "1.0.0"
id = "artifacts/bytewise-dsa"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24707

[services.development]
run = "pnpm --filter @workspace/bytewise-dsa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bytewise-dsa", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bytewise-dsa", "run", "serve" ]

[services.env]
PORT = "24707"
BASE_PATH = "/"
