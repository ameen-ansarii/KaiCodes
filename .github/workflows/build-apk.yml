name: Build Android APK (Free & Fast)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile to compile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Configure Gradle & Kotlin Memory (Prevent Metaspace OOM)
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
          org.gradle.parallel=true
          kotlin.daemon.jvm.options=-Xmx2048m,-XX:MaxMetaspaceSize=1024m
          EOF

      - name: 📦 Install Project Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: 🔨 Compile Android APK (Local on Linux Runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1536m' -Dkotlin.daemon.jvm.options='-Xmx2048m,-XX:MaxMetaspaceSize=1024m'"
          _JAVA_OPTIONS: "-Xmx4096m -XX:MaxMetaspaceSize=1536m"
        run: |
          pnpm exec eas build \
            --platform android \
            --profile ${{ inputs.profile || 'preview' }} \
            --local \
            --non-interactive \
            --output=./kaicode.apk

      - name: 📤 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaicode-${{ inputs.profile || 'preview' }}-apk
          path: ./kaicode.apk
          retention-days: 14
