name: Build Android APK (Free & Fast)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile to compile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle Cache (Fast Subsequent Builds)
        uses: gradle/actions/setup-gradle@v4

      - name: 🚀 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Project Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: 🔨 Compile Android APK (Local on Linux Runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm exec eas build \
            --platform android \
            --profile ${{ inputs.profile || 'preview' }} \
            --local \
            --non-interactive \
            --output=./kaicode.apk

      - name: 📤 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaicode-${{ inputs.profile || 'preview' }}-apk
          path: ./kaicode.apk
          retention-days: 14
